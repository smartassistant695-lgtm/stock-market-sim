<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Stock Chart Study</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/cormorant-garamond/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body class="site">
  <nav class="nav"><span class="nav-title">Noah &amp; Jojo</span><a class="nav-tab" href="index.html">Home</a><a class="nav-tab" href="simulation.html">Simulation</a><a class="nav-tab" href="about.html">About Us</a><a class="nav-tab" href="market.html">Market Data</a><a class="nav-tab" href="contact.html" aria-current="page">Contact Us</a></nav>

  <main class="contact-main">
    <header class="page-head">
      <h1 class="page-title">Contact Us</h1>
      <p class="page-sub">Questions about the study or the website? Send Noah and Jojo a message and we will get back to you.</p>
    </header>

    <!-- Messages are saved to the "Contact" tab of the Google Sheet. -->
    <form id="contact-form" class="contact-form" novalidate>
      <label class="field">
        <span class="field-label">Name</span>
        <input id="c-name" name="name" type="text" maxlength="100" autocomplete="name" required>
      </label>
      <label class="field">
        <span class="field-label">Email</span>
        <input id="c-email" name="email" type="email" maxlength="200" autocomplete="email" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Message</span>
        <textarea id="c-message" name="message" rows="7" maxlength="2000" required></textarea>
      </label>
      <!-- Hidden from people; spam robots fill it in, and those messages are ignored. -->
      <label class="trap" aria-hidden="true">Website <input id="c-website" name="website" type="text" tabindex="-1" autocomplete="off"></label>
      <div class="contact-actions">
        <button id="c-send" class="site-btn" type="submit">Send message</button>
        <p id="c-status" class="contact-status" role="status" aria-live="polite"></p>
      </div>
    </form>

    <!-- EDIT CONTACT EMAIL: replace [your email] with the address you want to show (or delete this paragraph). -->
    <p class="contact-alt">You can also email us at <span class="contact-email">[your email]</span>.</p>
  </main>

  <footer id="site-footer" data-page="Contact Us"></footer>
  <script src="js/footer.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
